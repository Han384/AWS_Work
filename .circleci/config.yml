#※別途、CircleCIの環境変数(Environment Variables)・SSH Keys を必要に応じて適宜設定する必要あり

version: 2.1
orbs:
  python: circleci/python@2.0.3
  aws-cli: circleci/aws-cli@4.0.0
  ansible-playbook: orbss/ansible-playbook@0.0.5
  ruby: circleci/ruby@2.0.1

jobs:
  cfn-lint:
    executor: python/default
    steps:
      - checkout
      - run: pip install cfn-lint
      - run:
          name: run cfn-lint
          command: |
            cfn-lint -i W3002 -t Tasks/lecture10/CloudFormation_templates/*.yml
            cfn-lint -i W3002 -t Tasks/lecture13/CloudFormation_templates/*.yml

  execute-cloudformation:
    executor: aws-cli/default
    steps:
      - checkout
      - aws-cli/setup:  # CircleCIのGUIにて環境変数を設定した値を使用
          aws_access_key_id: AWS_ACCESS_KEY_ID
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY
          region: AWS_DEFAULT_REGION
      - run:
          name: deploy Cloudformation
          command: | #パイプは改行させてコマンドを実行させてたい場合に必要
            set -x #シェルが実行コマンドとその引数を出力
            aws cloudformation deploy --stack-name cfn-vpc --template-file  Tasks/lecture10/CloudFormation_templates/01_cfn-vpc.yml
            aws cloudformation deploy --stack-name cfn-securitygroup --template-file  Tasks/lecture13/CloudFormation_templates/02_cfn-securitygroup-ansible.yml
            aws cloudformation deploy --stack-name cfn-rds --template-file  Tasks/lecture10/CloudFormation_templates/03_cfn-rds.yml
            aws cloudformation deploy --stack-name cfn-ec2 --template-file  Tasks/lecture13/CloudFormation_templates/04_cfn-ec2-ansible.yml --capabilities CAPABILITY_NAMED_IAM
            aws cloudformation deploy --stack-name cfn-elb --template-file  Tasks/lecture10/CloudFormation_templates/05_cfn-elb.yml
            aws cloudformation deploy --stack-name cfn-s3 --template-file  Tasks/lecture10/CloudFormation_templates/06_cfn-s3.yml

  execute-ansible:
    executor: ansible-playbook/default
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:  # CircleCIのGUIにて追加したSSHキー・環境変数設定した値を使用
            - FINGERPRINT
      - ansible-playbook/install:
          version: 2.10.7
      - run:
          name: use workspace & make env_set_serverspec.sh
          command: |
            #set -x
            mkdir /tmp/workspace
            cd ./circleci_practice
            source file_check.sh
            ####以下、確認用####
            ls -la /tmp
            ls -la /tmp/workspace
            cat  /tmp/workspace/env_set_serverspec.sh
            printenv | grep -E 'AWS|DB_SOCKET_PATH'
            printenv | grep BASH_ENV
            #cat /tmp/.bash_env-*
            ##################
      - run:
          name: env_set_ansible.sh & execute-ansible
          command: |
            #set -x
            cd ./circleci_practice
            source env_set_ansible.sh    # 環境変数を設定
            source add_ec2_ip.sh    # Ansible：inventoryにEC2のIPアドレスを追加
            cd ../ansible_practice/practice02/ansible-practice02
            ansible-playbook -i inventory playbook.yml
      # - ansible-playbook/playbook:
      #     playbook: ansible_practice/practice02/ansible-practice02/playbook.yml
      #     playbook-options: " -i ansible_practice/practice02/ansible-practice02/inventory"
      - persist_to_workspace: # 別のジョブでファイルを共有するため workspaceを設定(ジョブ内のデータが保存される)
          root: /tmp/workspace
          paths:
            - env_set_serverspec.sh

  execute-serverspec:
    executor: ruby/default
    steps:
      - checkout
      - ruby/install: #(参考) Ruby をバージョン指定してインストール
          version: 3.1.2
      - ruby/install-deps: # Bundler を使用して gem をインストール
          bundler-version: 2.3.14 #(参考) Bundler をバージョン指定してインストール
          app-dir: ./ansible_practice/practice02/serverspec #Gemfile を含むディレクトリへのパス (Gemfile がルートに存在する場合は不要)
      - attach_workspace: # 別のジョブで設定されたワークスペースを使用(異なるジョブ間でデータ共有が可能となる)
          at: /tmp/workspace
      - run: |
          cat /tmp/workspace/env_set_serverspec.sh
          source /tmp/workspace/env_set_serverspec.sh   # 環境変数を設定
          printenv | grep AWS
          cd ./circleci_practice
          source add_ec2_ip.sh    # Serverspec：指定のディレクトリ名をEC2のIPアドレスに変更
          cd ../ansible_practice/practice02/serverspec
          bundle exec rake
          #env ALB_DNS=$(cat /tmp/workspace/env_set_serverspec.txt) bundle exec rake
      ####以下、確認用####
      - run: |
          #set -x
          source /tmp/workspace/env_set_serverspec.sh
          uname -a && id && pwd && ls -la && git --version
          ssh -i ~/.ssh/id_rsa ${USER_NAME}@${AWS_EC2_IP} -o StrictHostKeyChecking=no "ec2-metadata | grep ipv4 && uname -a && id && pwd && ls -la && git --version && ec2-metadata"
      ##################

workflows:
  AWS_Work_CircleCI:
    jobs:
      - cfn-lint
      - execute-cloudformation:
          requires:
            - cfn-lint
      - execute-ansible:
          requires:
            - execute-cloudformation
      - execute-serverspec:
          requires:
            - execute-ansible
