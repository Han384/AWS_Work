ruby_version: 3.1.2
bundler_version: 2.3.14
rails_version: 7.0.4
node_version: 17.9.1
yarn_version: 1.22.19
aws_db_user: "{{ lookup('env', 'AWS_DB_USER') }}"
aws_db_pw: "{{ lookup('env', 'AWS_DB_PW') }}"
aws_db_host: "{{ lookup('env', 'AWS_DB_HOST') }}"
db_socket_path: "{{ lookup('env', 'DB_SOCKET_PATH') }}"
aws_alb_endpoint: "{{ lookup('env', 'AWS_ALB_ENDPOINT') }}"
aws_s3_access_key : "{{ lookup('env', 'AWS_S3_ACCESS_KEY') }}"
